<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="google-site-verification" content="2nDXBnxwaE3uxcTz6x4tFWHYnifQqn-xD9je7ugmVdU" />
<title>St. Veronica Bumadeya Primary School — ClassConnect</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* ---- Three-colour system: deep green, light green, white ----
     Every colour in the app resolves to one of these tokens. There are no
     blues, purples, reds, golds or neutral greys anywhere in the build. */
  --white:#FFFFFF;
  --paper:#F4F9EF;          /* very light green tint behind the app */
  --surface:#FFFFFF;        /* cards */
  --surface2:#F8FBF4;       /* subtle tinted surface */
  --sunken:#E9F3E0;         /* wells, chart grid, inactive chips */
  --border:#D9E9CE; --border-strong:#BCD8A6;

  --ink:#06331C;            /* dark forest green — all body text */
  --muted:#2E5C42;
  --faint:#45785B;

  --green:#095C32;          /* crest shield green — primary accent */
  --green-2:#063F22;        /* hover / pressed */
  --green-soft:#E6F2DD;     /* light green fill behind active items */
  --light-green:#90C144;    /* crest lower-panel green — secondary accent */
  --light-green-2:#BBDB8C;

  /* legacy semantic names, all resolved into the crest palette */
  --ochre:#4F8C2F; --ochre-soft:#EDF5E1;
  --clay:#063F22;  --clay-soft:#E6F2DD;
  --ok:#095C32;    --ok-soft:#E6F2DD;
  --on-green:#FFFFFF;

  --r-sm:8px; --r:12px; --r-lg:18px;
  --shadow:0 1px 2px rgba(6,51,28,.06), 0 10px 26px -18px rgba(6,51,28,.32);
  --shadow-lg:0 2px 6px rgba(6,51,28,.08), 0 26px 50px -28px rgba(6,51,28,.4);
  --sans:"Figtree", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --display:"Space Grotesk", "Figtree", ui-sans-serif, system-ui, sans-serif;
  --sidebar:252px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top, 0px);
  padding-bottom:env(safe-area-inset-bottom, 0px);
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px); -webkit-text-size-adjust:100%}
body{
  margin:0; min-height:100%; background:var(--paper); color:var(--ink);
  font-family:var(--sans); font-size:15px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4,.num{font-family:var(--display); font-weight:600; letter-spacing:-.02em; margin:0}
h1{font-size:clamp(1.45rem,1.1rem + 1.4vw,2rem); line-height:1.15}
h2{font-size:1.18rem}
h3{font-size:1rem}
p{margin:0 0 .8em}
a{color:var(--green); text-underline-offset:3px}
a:hover{color:var(--green-2)}
img{max-width:100%}
:focus-visible{outline:2.5px solid var(--green-2); outline-offset:2px; border-radius:4px}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms !important; transition-duration:.01ms !important}}

/* ---------- primitives ---------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:.5rem;
  font:inherit; font-weight:600; font-size:.9rem; padding:.62rem 1rem; border-radius:var(--r-sm);
  border:1px solid transparent; background:var(--green); color:var(--on-green); cursor:pointer;
  transition:background .15s ease, border-color .15s ease, color .15s ease; text-decoration:none; white-space:nowrap;
}
.btn:hover{background:var(--green-2); color:var(--on-green)}
.btn:disabled{opacity:.5; cursor:not-allowed}
.btn.ghost{background:transparent; border-color:var(--border-strong); color:var(--ink)}
.btn.ghost:hover{background:var(--surface2); color:var(--ink)}
.btn.quiet{background:transparent; color:var(--muted); padding:.4rem .55rem}
.btn.quiet:hover{background:var(--surface2); color:var(--ink)}
.btn.danger{background:var(--white); color:var(--green-2); border-color:var(--green-2); border-style:dashed}
.btn.danger:hover{background:var(--green-soft); color:var(--green-2)}
.btn.sm{padding:.4rem .7rem; font-size:.82rem}
.btn.block{width:100%}
.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--r); box-shadow:var(--shadow)}
.pad{padding:1.1rem 1.15rem}
.stack{display:flex; flex-direction:column; gap:1rem}
.row{display:flex; align-items:center; gap:.65rem}
.row.wrap{flex-wrap:wrap}
.spread{display:flex; align-items:center; justify-content:space-between; gap:.75rem; flex-wrap:wrap}
.grid{display:grid; gap:1rem}
.muted{color:var(--muted)}
.faint{color:var(--faint); font-size:.85rem}
.small{font-size:.85rem}
.mono-num{font-family:var(--display); font-variant-numeric:tabular-nums}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
.divider{height:1px; background:var(--border); border:0; margin:.9rem 0}

.tag{display:inline-flex; align-items:center; gap:.35rem; font-size:.76rem; font-weight:600; padding:.22rem .55rem; border-radius:999px; background:var(--sunken); color:var(--muted); white-space:nowrap}
.tag.ok{background:var(--green); color:var(--white)}
.tag.warn{background:var(--white); color:var(--green); box-shadow:inset 0 0 0 1.5px var(--light-green)}
.tag.bad{background:var(--sunken); color:var(--muted); box-shadow:inset 0 0 0 1.5px var(--border-strong)}
.tag.info{background:var(--light-green-2); color:var(--green-2)}
.tag.dot::before{content:""; width:6px; height:6px; border-radius:50%; background:currentColor}

.avatar{display:grid; place-items:center; width:38px; height:38px; border-radius:50%; font-family:var(--display); font-weight:600; font-size:.82rem; color:var(--on-green); flex:none; letter-spacing:.01em}
.avatar.lg{width:72px; height:72px; font-size:1.4rem}
.avatar.sm{width:30px; height:30px; font-size:.7rem}

/* ---------- forms ---------- */
label{display:block; font-size:.84rem; font-weight:600; margin-bottom:.3rem; color:var(--ink)}
input,select,textarea{
  width:100%; font:inherit; font-size:.92rem; color:var(--ink); background:var(--surface);
  border:1px solid var(--border-strong); border-radius:var(--r-sm); padding:.6rem .7rem;
}
textarea{min-height:110px; resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--green); outline:2px solid color-mix(in srgb, var(--green) 25%, transparent); outline-offset:0}
.field{margin-bottom:.9rem}
.field .hint{font-size:.78rem; color:var(--faint); margin-top:.25rem}
.field .err{font-size:.78rem; color:var(--green-2); margin-top:.25rem; font-weight:600; display:none}
.field.invalid input,.field.invalid select,.field.invalid textarea{border-color:var(--green-2); border-width:2px; background:var(--green-soft)}
.field.invalid .err{display:block}
.field-row{display:grid; grid-template-columns:1fr 1fr; gap:.75rem}
@media (max-width:540px){.field-row{grid-template-columns:1fr}}
.checkrow{display:flex; align-items:flex-start; gap:.55rem; font-size:.88rem}
.checkrow input{width:auto; margin-top:.2rem}

/* ---------- auth / landing ---------- */
.public{min-height:100vh; display:flex; flex-direction:column}
.pubnav{display:flex; align-items:center; justify-content:space-between; gap:1rem; padding:1rem clamp(1rem,4vw,3rem); border-bottom:1px solid var(--border); background:var(--surface)}
.wordmark{display:flex; align-items:center; gap:.55rem; font-family:var(--display); font-weight:700; font-size:1.05rem; letter-spacing:-.03em; color:var(--ink); text-decoration:none}
.wordmark .mk{display:grid; place-items:center; width:30px; height:30px; border-radius:9px; background:var(--green); color:var(--on-green); font-size:.85rem}
.brand{display:flex; align-items:center; gap:.6rem; text-decoration:none; color:var(--ink); min-width:0}
.brand .crest{width:42px; height:42px; flex:none; border-radius:50%}
.brand .crest.lg{width:120px; height:120px}
.brand b{display:block; font-family:var(--display); font-weight:700; font-size:.92rem; letter-spacing:-.02em; line-height:1.15}
.brand span.sub{display:block; font-size:.72rem; color:var(--faint); font-weight:500; line-height:1.3}
.side-head .brand{flex:1; min-width:0}
.pubnav .brand .crest{width:46px; height:46px}
@media (max-width:560px){.pubnav .brand b{font-size:.82rem} .pubnav .brand span.sub{display:none}}
.crest-hero{display:flex; align-items:center; gap:1rem; margin-bottom:1.4rem}
.crest-hero img{width:88px; height:88px; flex:none}
.motto{font-family:var(--display); font-weight:600; color:var(--green); letter-spacing:.01em}
.auth-crest{display:block; width:84px; height:84px; margin:0 auto 1rem}
.hero{padding:clamp(2.2rem,6vw,4.5rem) clamp(1rem,4vw,3rem); max-width:1140px; margin:0 auto; width:100%}
.hero-grid{display:grid; grid-template-columns:1.05fr .95fr; gap:clamp(1.5rem,4vw,3.5rem); align-items:center}
@media (max-width:860px){.hero-grid{grid-template-columns:1fr}}
.hero h1{font-size:clamp(2rem,1.2rem + 3.4vw,3.35rem); letter-spacing:-.035em; line-height:1.04; margin-bottom:.9rem}
.hero .lede{font-size:1.06rem; color:var(--muted); max-width:52ch}
.rollcall{background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg); padding:1.25rem; box-shadow:var(--shadow-lg)}
.rollcall .rc-head{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:.9rem; font-size:.85rem; color:var(--muted)}
.rc-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(52px,1fr)); gap:.5rem}
.rc-cell{aspect-ratio:1; border-radius:11px; display:grid; place-items:center; font-family:var(--display); font-weight:600; font-size:.8rem; color:var(--on-green)}
.rc-cell.empty{background:var(--sunken); color:var(--faint); font-size:1rem}
.rc-foot{margin-top:1rem; padding-top:.9rem; border-top:1px solid var(--border); display:grid; grid-template-columns:repeat(3,1fr); gap:.5rem; text-align:left}
.rc-foot b{display:block; font-family:var(--display); font-size:1.15rem}
.features{display:grid; grid-template-columns:repeat(auto-fit,minmax(215px,1fr)); gap:1rem; padding:0 clamp(1rem,4vw,3rem) clamp(2.5rem,6vw,4rem); max-width:1140px; margin:0 auto; width:100%}
.feature{background:var(--surface); border:1px solid var(--border); border-radius:var(--r); padding:1.1rem}
.feature h3{margin-bottom:.35rem}
.feature p{font-size:.9rem; color:var(--muted); margin:0}
.pubfoot{margin-top:auto; padding:1.25rem clamp(1rem,4vw,3rem); border-top:1px solid var(--border); color:var(--faint); font-size:.85rem; background:var(--surface)}

.auth-wrap{flex:1; display:grid; place-items:center; padding:clamp(1.25rem,4vw,3rem) 1rem}
.auth-card{width:100%; max-width:430px; background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg); padding:clamp(1.3rem,3vw,2rem); box-shadow:var(--shadow-lg)}
.auth-card h1{font-size:1.5rem; margin-bottom:.35rem}
.auth-card .sub{color:var(--muted); font-size:.92rem; margin-bottom:1.3rem}

/* ---------- app shell ---------- */
.shell{display:grid; grid-template-columns:var(--sidebar) 1fr; min-height:100vh}
@media (max-width:1000px){.shell{grid-template-columns:1fr}}
.sidebar{
  background:var(--surface); border-right:1px solid var(--border); display:flex; flex-direction:column;
  position:sticky; top:0; height:100vh; overflow-y:auto; padding:1rem .75rem;
  padding-top:calc(1rem + env(safe-area-inset-top,0px));
}
@media (max-width:1000px){
  .sidebar{position:fixed; inset:0 auto 0 0; width:280px; z-index:60; transform:translateX(-102%); transition:transform .22s ease; box-shadow:var(--shadow-lg)}
  body.nav-open .sidebar{transform:none}
  .scrim{position:fixed; inset:0; background:rgba(6,51,28,.4); z-index:55; opacity:0; pointer-events:none; transition:opacity .2s ease}
  body.nav-open .scrim{opacity:1; pointer-events:auto}
}
.side-head{display:flex; align-items:center; justify-content:space-between; padding:.35rem .5rem 1rem}
.nav-group{margin-bottom:.9rem}
.nav-group > span{display:block; font-size:.72rem; font-weight:700; color:var(--faint); padding:0 .6rem .35rem; letter-spacing:.04em}
.nav-link{
  display:flex; align-items:center; gap:.6rem; padding:.52rem .6rem; border-radius:var(--r-sm);
  color:var(--muted); text-decoration:none; font-size:.9rem; font-weight:500; position:relative;
}
.nav-link:hover{background:var(--surface2); color:var(--ink)}
.nav-link.active{background:var(--green-soft); color:var(--green); font-weight:600}
.nav-link svg{width:17px; height:17px; flex:none; stroke:currentColor; fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round}
.nav-link .count{margin-left:auto; background:var(--green); color:var(--white); font-size:.7rem; font-weight:700; padding:.05rem .4rem; border-radius:999px}
.side-foot{margin-top:auto; padding-top:.8rem; border-top:1px solid var(--border)}

.main{min-width:0; display:flex; flex-direction:column}
.topbar{
  position:sticky; top:0; z-index:40; background:color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter:saturate(1.3) blur(10px); border-bottom:1px solid var(--border);
  display:flex; align-items:center; gap:.75rem; padding:.7rem clamp(.85rem,2.5vw,1.6rem);
  padding-top:calc(.7rem + env(safe-area-inset-top,0px));
}
.search{position:relative; flex:1; max-width:420px}
.search input{padding-left:2.1rem; background:var(--surface2)}
.search svg{position:absolute; left:.65rem; top:50%; transform:translateY(-50%); width:16px; height:16px; stroke:var(--faint); fill:none; stroke-width:1.8}
.icon-btn{position:relative; display:grid; place-items:center; width:38px; height:38px; border-radius:var(--r-sm); border:1px solid transparent; background:transparent; cursor:pointer; color:var(--muted)}
.icon-btn:hover{background:var(--surface2); color:var(--ink)}
.icon-btn svg{width:19px; height:19px; stroke:currentColor; fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round}
.badge{position:absolute; top:4px; right:4px; min-width:17px; height:17px; padding:0 4px; border-radius:999px; background:var(--green); color:var(--white); font-size:.66rem; font-weight:700; display:grid; place-items:center; font-family:var(--display)}
.menu{position:relative}
.menu-pop{position:absolute; right:0; top:calc(100% + .5rem); background:var(--surface); border:1px solid var(--border); border-radius:var(--r); box-shadow:var(--shadow-lg); min-width:220px; padding:.35rem; display:none; z-index:50}
.menu-pop.open{display:block}
.menu-pop a,.menu-pop button{display:flex; width:100%; align-items:center; gap:.5rem; padding:.5rem .6rem; border-radius:var(--r-sm); background:none; border:0; font:inherit; font-size:.88rem; color:var(--ink); text-decoration:none; cursor:pointer; text-align:left}
.menu-pop a:hover,.menu-pop button:hover{background:var(--surface2)}
.content{padding:clamp(1rem,2.5vw,1.75rem); max-width:1280px; width:100%; margin:0 auto; flex:1}
.page-head{margin-bottom:1.25rem}
.page-head p{color:var(--muted); margin:.25rem 0 0; max-width:70ch}

/* ---------- stats ---------- */
.stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(185px,1fr)); gap:.85rem}
.stat{background:var(--surface); border:1px solid var(--border); border-radius:var(--r); padding:.95rem 1rem; box-shadow:var(--shadow)}
.stat .k{font-size:.82rem; color:var(--muted); font-weight:600}
.stat .v{font-family:var(--display); font-size:1.62rem; font-weight:600; letter-spacing:-.03em; margin-top:.2rem; font-variant-numeric:tabular-nums; line-height:1.15}
.stat .s{font-size:.8rem; color:var(--faint); margin-top:.15rem}
.stat.accent{border-left:3px solid var(--green)}
.stat.warnline{border-left:3px solid var(--light-green)}
.stat.ochreline{border-left:3px solid var(--light-green-2)}

/* ---------- tables ---------- */
.table-wrap{overflow-x:auto; -webkit-overflow-scrolling:touch}
table{width:100%; border-collapse:collapse; font-size:.9rem; min-width:560px}
th{text-align:left; font-size:.78rem; color:var(--muted); font-weight:700; padding:.6rem .8rem; border-bottom:1px solid var(--border); white-space:nowrap; background:var(--surface2)}
td{padding:.7rem .8rem; border-bottom:1px solid var(--border); vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface2)}
td.right,th.right{text-align:right}
.linkish{background:none; border:0; padding:0; font:inherit; color:var(--green); font-weight:600; cursor:pointer; text-align:left}
.linkish:hover{text-decoration:underline}

.empty{text-align:center; padding:2.4rem 1rem; color:var(--muted)}
.empty h3{margin-bottom:.3rem; color:var(--ink)}

/* ---------- lists ---------- */
.item{display:flex; gap:.85rem; padding:.85rem 0; border-bottom:1px solid var(--border)}
.item:last-child{border-bottom:0}
.item .body{min-width:0; flex:1}
.item h4{font-size:.95rem; margin-bottom:.15rem}
.item p{font-size:.88rem; color:var(--muted); margin:0}
.clamp2{display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.notif{display:flex; gap:.8rem; padding:.85rem .9rem; border:1px solid var(--border); border-radius:var(--r); background:var(--surface); margin-bottom:.6rem}
.notif.unread{background:var(--green-soft); border-color:color-mix(in srgb, var(--green) 30%, var(--border))}
.filters{display:flex; gap:.6rem; flex-wrap:wrap; align-items:flex-end}
.filters .field{margin-bottom:0; min-width:150px; flex:1 1 150px}
.chips{display:flex; gap:.4rem; flex-wrap:wrap}
.chip{border:1px solid var(--border-strong); background:var(--surface); color:var(--muted); border-radius:999px; padding:.3rem .7rem; font-size:.82rem; font-weight:600; cursor:pointer; font-family:inherit}
.chip[aria-pressed="true"]{background:var(--green); border-color:var(--green); color:var(--on-green)}
.vote{display:inline-flex; align-items:center; gap:.35rem; border:1px solid var(--border-strong); background:var(--surface); border-radius:999px; padding:.3rem .65rem; font:inherit; font-size:.85rem; font-weight:600; cursor:pointer; color:var(--muted)}
.vote[aria-pressed="true"].up{background:var(--green); border-color:var(--green); color:var(--white)}
.vote[aria-pressed="true"].down{background:var(--white); border-color:var(--green-2); color:var(--green-2); box-shadow:inset 0 0 0 1px var(--green-2)}
.agenda{margin:0; padding-left:1.1rem}
.agenda li{margin-bottom:.3rem}
.timeline{list-style:none; margin:0; padding:0}
.timeline li{display:flex; gap:.7rem; padding:.5rem 0; font-size:.88rem; border-bottom:1px solid var(--border)}
.timeline li:last-child{border-bottom:0}
.timeline .when{color:var(--faint); font-size:.78rem; white-space:nowrap; margin-left:auto}

/* ---------- charts ---------- */
.chart{width:100%; height:auto; display:block; overflow:visible}
.chart text{font-family:var(--sans); fill:var(--muted); font-size:11px}
.legend{display:flex; gap:1rem; flex-wrap:wrap; font-size:.83rem; color:var(--muted); margin-top:.6rem}
.legend i{width:10px; height:10px; border-radius:3px; display:inline-block; margin-right:.35rem}

/* ---------- modal & toast ---------- */
.modal-bg{position:fixed; inset:0; background:rgba(6,51,28,.45); display:grid; place-items:center; padding:1rem; z-index:100; overflow-y:auto}
.modal{background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg); width:100%; max-width:520px; box-shadow:var(--shadow-lg); margin:auto; max-height:92vh; display:flex; flex-direction:column}
.modal.wide{max-width:680px}
.modal-head{display:flex; align-items:center; justify-content:space-between; padding:1rem 1.15rem; border-bottom:1px solid var(--border)}
.modal-body{padding:1.15rem; overflow-y:auto}
.modal-foot{display:flex; justify-content:flex-end; gap:.6rem; padding:.9rem 1.15rem; border-top:1px solid var(--border); background:var(--surface2); border-radius:0 0 var(--r-lg) var(--r-lg)}
.toasts{position:fixed; z-index:200; bottom:calc(1rem + env(safe-area-inset-bottom,0px)); left:50%; transform:translateX(-50%); display:flex; flex-direction:column; gap:.5rem; width:calc(100% - 2rem); max-width:400px}
.toast{background:var(--green-2); color:var(--white); padding:.7rem .9rem; border-radius:var(--r-sm); font-size:.88rem; box-shadow:var(--shadow-lg); display:flex; gap:.5rem; align-items:center}
.toast.bad{background:var(--ink); color:var(--white); box-shadow:inset 0 0 0 2px var(--light-green), var(--shadow-lg)}
.hide-desktop{display:none}
@media (max-width:1000px){.hide-desktop{display:grid}.hide-mobile{display:none}}
@media (max-width:640px){
  .content{padding:.9rem}
  .search{max-width:none}
  .hero .rollcall{order:-1}
}
pre.code{background:var(--sunken); border:1px solid var(--border); border-radius:var(--r-sm); padding:.85rem; overflow-x:auto; font-size:.8rem; line-height:1.5; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; margin:0 0 1rem}
.docs h2{margin:1.6rem 0 .6rem}
.docs h3{margin:1.1rem 0 .4rem}
.docs ol,.docs ul{padding-left:1.2rem; color:var(--muted)}
.docs li{margin-bottom:.35rem}
.prose{max-width:72ch}
.prose p{white-space:pre-wrap}
</style>
</head>
<body>
<div id="root"><div style="min-height:100vh;display:grid;place-items:center;color:var(--faint);font:600 .9rem var(--sans)">Loading ClassConnect…</div></div>

/* ---------------- tiny utilities ---------------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = (n) => CUR + ' ' + Number(n || 0).toLocaleString('en-KE', { maximumFractionDigits: 0 });
const initials = (u) => ((u && u.firstName || '?')[0] + ((u && u.lastName) || '')[0] || '').toUpperCase();
const fullName = (u) => u ? `${u.firstName} ${u.lastName}`.trim() || u.email : 'Unknown member';
const todayISO = () => new Date().toISOString().slice(0, 10);
function fmtDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
}
function fmtLong(iso) {
  const d = new Date(iso);
  return isNaN(d) ? iso : d.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
}
function fmtTime(t) {
  if (!t) return '';
  const [h, m] = t.split(':').map(Number);
  const ap = h >= 12 ? 'PM' : 'AM';
  return `${((h + 11) % 12) + 1}:${String(m).padStart(2, '0')} ${ap}`;
}
function ago(iso) {
  const s = (Date.now() - new Date(iso).getTime()) / 1000;
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s / 60) + 'm ago';
  if (s < 86400) return Math.floor(s / 3600) + 'h ago';
  if (s < 604800) return Math.floor(s / 86400) + 'd ago';
  return fmtDate(iso);
}
const AVATAR_GREENS = ['#095C32', '#063F22', '#177040', '#0B4A29', '#2E7F3C'];
function avatarColor(seed) {
  let h = 0;
  for (const ch of String(seed)) h = (h * 31 + ch.charCodeAt(0)) % 997;
  return AVATAR_GREENS[h % AVATAR_GREENS.length];
}
function avatar(u, cls = '') {
  if (!u) return '';
  return `<div class="avatar ${cls}" style="background:${avatarColor(u.id)}" aria-hidden="true">${esc(initials(u))}</div>`;
}
function toast(msg, bad) {
  const el = document.createElement('div');
  el.className = 'toast' + (bad ? ' bad' : '');
  el.setAttribute('role', 'status');
  el.textContent = msg;
  $('#toasts').appendChild(el);
  setTimeout(() => el.remove(), 4200);
}

/* ---------------- camelCase (app) <-> snake_case (Postgres) ----------------
   Every JS field name below was chosen to convert mechanically to its
   Postgres column name (userId -> user_id, defaultAmount -> default_amount,
   ...), so one generic pair of functions replaces a hand-written map per
   table. See supabase-schema.sql for the column names this assumes. */
const toSnake = (s) => s.replace(/[A-Z]/g, c => '_' + c.toLowerCase());
const toCamel = (s) => s.replace(/_([a-z])/g, (_, c) => c.toUpperCase());
function rowToObj(row) {
  if (!row) return null;
  const o = {};
  for (const k in row) o[toCamel(k)] = row[k];
  return o;
}
function objToRow(obj) {
  const o = {};
  for (const k in obj) if (obj[k] !== undefined) o[toSnake(k)] = obj[k];
  return o;
}

/* ---------------- repository layer ------------------------------------
   state[cacheKey] mirrors the current user's readable rows (Postgres RLS
   decides what that includes) so every view function can keep reading
   db.x.all()/find()/where() synchronously, exactly as before. Only the
   mutating calls — insert/update/remove — talk to the network, so every
   call site that writes data has to be awaited; the render-only call
   sites needed no changes at all when this replaced localStorage. */
let state = null;
const CACHE_KEYS = ['users', 'contributionTypes', 'contributions', 'suggestions', 'suggestionVotes',
  'announcements', 'meetings', 'meetingMinutes', 'notifications', 'activityLogs'];
const TABLE_NAMES = {
  users: 'profiles', contributionTypes: 'contribution_types', contributions: 'contributions',
  suggestions: 'suggestions', suggestionVotes: 'suggestion_votes', announcements: 'announcements',
  meetings: 'meetings', meetingMinutes: 'meeting_minutes', notifications: 'notifications',
  activityLogs: 'activity_logs'
};
function resetCache() {
  state = { settings: defaultSettings(), groupSummary: null, monthlyCollections: [] };
  CACHE_KEYS.forEach(k => { state[k] = []; });
}
function defaultSettings() {
  return {
    orgName: SCHOOL + ' Association', tagline: MOTTO, currency: CUR, monthlyWelfare: 500,
    allowRegistration: true, mpesaPaybill: '', mpesaAccountPrefix: 'SVB'
  };
}
resetCache();

function sbTable(cacheKey) {
  const table = TABLE_NAMES[cacheKey];
  return {
    all: () => state[cacheKey].slice(),
    find: (id) => state[cacheKey].find(r => r.id === id) || null,
    where: (fn) => state[cacheKey].filter(fn),
    async insert(obj) {
      const { data, error } = await sb.from(table).insert(objToRow(obj)).select().single();
      if (error) { toast('Could not save: ' + error.message, true); throw error; }
      const r = rowToObj(data);
      state[cacheKey].push(r);
      return r;
    },
    async update(id, patch) {
      const { data, error } = await sb.from(table).update(objToRow(patch)).eq('id', id).select().single();
      if (error) { toast('Could not save: ' + error.message, true); throw error; }
      const r = rowToObj(data);
      const idx = state[cacheKey].findIndex(x => x.id === id);
      if (idx >= 0) state[cacheKey][idx] = r; else state[cacheKey].push(r);
      return r;
    },
    async remove(id) {
      const { error } = await sb.from(table).delete().eq('id', id);
      if (error) { toast('Could not delete: ' + error.message, true); throw error; }
      state[cacheKey] = state[cacheKey].filter(x => x.id !== id);
    }
  };
}
const db = {};
CACHE_KEYS.forEach(k => { db[k] = sbTable(k); });

const outstandingOf = (c) => c.status === 'Cancelled' ? 0 : Math.max(0, (c.amount || 0) - (c.paid || 0));

function memberTotals(userId) {
  const rows = db.contributions.where(c => c.userId === userId && c.status !== 'Cancelled');
  return {
    paid: rows.reduce((s, c) => s + (c.paid || 0), 0),
    due: rows.reduce((s, c) => s + (c.amount || 0), 0),
    outstanding: rows.reduce((s, c) => s + outstandingOf(c), 0),
    count: rows.length

}
// A plain member's `contributions` cache only ever contains their own rows
// — Postgres RLS enforces that server-side (see supabase-schema.sql) so
// there is no separate client-side check needed. Staff (treasurer/admin)
// can read every row, so groupTotals() computes exact figures from the
// full cache for them; everyone else falls back to the pre-fetched
// security-definer summary, which is exact but has no per-row detail.
function groupTotals() {
  if (canManageMoney()) {
    const rows = db.contributions.where(c => c.status !== 'Cancelled');
    const members = db.users.where(u => u.status === 'active');
    const paidIds = new Set(rows.filter(c => c.status === 'Paid').map(c => c.userId));
    const owingIds = new Set(rows.filter(c => outstandingOf(c) > 0).map(c => c.userId));
    return {
      collected: rows.reduce((s, c) => s + (c.paid || 0), 0),
      expected: rows.reduce((s, c) => s + (c.amount || 0), 0),
      outstanding: rows.reduce((s, c) => s + outstandingOf(c), 0),
      members: members.length,
      fullyPaid: [...paidIds].filter(id => !owingIds.has(id)).length,
      owing: owingIds.size
    };
  }
  return state.groupSummary || { collected: 0, expected: 0, outstanding: 0, members: db.users.all().length, fullyPaid: 0, owing: 0 };
}

function friendlyAuthError(error) {
  const m = String(error && error.message || error);
  if (/invalid login credentials/i.test(m)) return 'That email and password combination is not correct.';
  if (/email not confirmed/i.test(m)) return 'Please confirm your email address first — check your inbox for the link we sent.';
  if (/user already registered/i.test(m)) return 'That email address is already registered.';
  if (/password.*at least/i.test(m)) return 'Use a password of at least 8 characters.';
  return m;
}
// The trigger in supabase-schema.sql creates the profile row in the same
// transaction as the auth.users insert, but the client still makes a
// separate round trip to read it back, so a short retry absorbs any
// ordinary replication lag rather than surfacing a spurious error.
async function fetchProfile(id, tries = 6) {
  for (let i = 0; i < tries; i++) {
    const { data, error } = await sb.from('profiles').select('*').eq('id', id).maybeSingle();
    if (data) return rowToObj(data);
    if (error) break;
    await new Promise(r => setTimeout(r, 350));
  }
  return null;
}
async function login(email, password) {
  const { data, error } = await sb.auth.signInWithPassword({ email: String(email).trim().toLowerCase(), password });
  if (error) return { error: friendlyAuthError(error) };
  const profile = await fetchProfile(data.user.id);
  if (!profile) return { error: 'Signed in, but no profile was found for this account. Contact an administrator.' };
  if (profile.status !== 'active') { await sb.auth.signOut(); return { error: 'This account has been deactivated. Contact an administrator.' }; }
  session.user = profile;
  logActivity('Signed in');
  return { user: profile };
}
async function register(data) {
  const email = String(data.email).trim().toLowerCase();
  const { data: authData, error } = await sb.auth.signUp({
    email, password: data.password,
    options: { data: { first_name: data.firstName, last_name: data.lastName, phone: data.phone } }
  });
  if (error) return { error: friendlyAuthError(error) };
  if (!authData.session) return { needsConfirmation: true };
  const profile = await fetchProfile(authData.user.id);
  if (!profile) return { error: 'Account created, but the profile could not be loaded. Try signing in.' };
  session.user = profile;
  const isFirstAccount = profile.role === 'admin';
  if (isFirstAccount) logActivity('Created the first account and became administrator');
  else {
    notify(profile.id, 'Welcome to ClassConnect. Complete your profile so other members can find you.', '#/profile');
  }
  return { user: profile, isFirstAccount };
}

const RULES = {
  required: (v) => String(v || '').trim() ? '' : 'This field is required.',
  email: (v) => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(String(v).trim()) ? '' : 'Enter a valid email address.',
  phone: (v) => /^[0-9+\s-]{7,15}$/.test(String(v).trim()) ? '' : 'Enter a valid phone number.',
  password: (v) => String(v).length >= 8 ? '' : 'Use at least 8 characters.',

  positive: (v) => (!isNaN(v) && Number(v) > 0) ? '' : 'Enter an amount greater than zero.'

function validate(form, spec) {
  let ok = true;
  Object.entries(spec).forEach(([name, checks]) => {
    const input = form.elements[name];
    if (!input) return;
    const field = input.closest('.field');
    const errEl = field ? field.querySelector('.err') : null;
    let msg = '';
    for (const c of checks) { msg = RULES[c](input.value); if (msg) break; }
    if (field) field.classList.toggle('invalid', !!msg);
    if (errEl) errEl.textContent = msg;
    if (msg && ok) { input.focus(); ok = false; }
  });
  return ok;
}
const fieldHTML = (name, label, opts = {}) => {
  const { type = 'text', value = '', hint = '', placeholder = '', options, rows, required } = opts;
  let control;
  if (type === 'select') {
    control = `<select id="f_${name}" name="${name}">${options.map(o => {
      const v = typeof o === 'string' ? o : o.value, l = typeof o === 'string' ? o : o.label;
      return `<option value="${esc(v)}"${String(v) === String(value) ? ' selected' : ''}>${esc(l)}</option>`;
    }).join('')}</select>`;
  } else if (type === 'textarea') {
    control = `<textarea id="f_${name}" name="${name}" rows="${rows || 4}" placeholder="${esc(placeholder)}">${esc(value)}</textarea>`;
  } else {
    control = `<input id="f_${name}" name="${name}" type="${type}" value="${esc(value)}" placeholder="${esc(placeholder)}"${required ? ' required' : ''}>`;
  }
  return `<div class="field">
    <label for="f_${name}">${esc(label)}</label>${control}
    ${hint ? `<div class="hint">${esc(hint)}</div>` : ''}<div class="err"></div>
  </div>`;
};

function barChart(data, { height = 190, format = money } = {}) {

    const x = (i * w + w * 0.18) * 3.2, bw = w * 0.64 * 3.2;
    return `<g><rect x="${x}" y="${height - 34 - h}" width="${bw}" height="${h}" rx="3" fill="${d.color || 'var(--green)'}"><title>${esc(d.label)}: ${esc(format(d.value))}</title></rect>

function donut(parts, centerTop, centerSub) {
  const total = parts.reduce((s, p) => s + p.value, 0) || 1;
  let acc = 0;
  const R = 54, C = 2 * Math.PI * R;
  return `<div class="row" style="gap:1.2rem; flex-wrap:wrap">
    <svg viewBox="0 0 140 140" style="width:140px;height:140px;flex:none" role="img" aria-label="Distribution">
      <circle cx="70" cy="70" r="${R}" fill="none" stroke="var(--sunken)" stroke-width="18"/>
      ${parts.map(p => {
    const len = (p.value / total) * C, dash = `${len} ${C - len}`, off = -acc;
    acc += len;
    return `<circle cx="70" cy="70" r="${R}" fill="none" stroke="${p.color}" stroke-width="18"
      stroke-dasharray="${dash}" stroke-dashoffset="${off}" transform="rotate(-90 70 70)"><title>${esc(p.label)}: ${esc(money(p.value))}</title></circle>`;
  }).join('')}
      <text x="70" y="66" text-anchor="middle" style="font-family:var(--display);font-size:15px;fill:var(--ink);font-weight:600">${esc(centerTop)}</text>

    </div></div>`;
}

function monthlySeries(months = 6) {

    for (let i = months - 1; i >= 0; i--) {

      const value = db.contributions.where(c => c.status !== 'Cancelled' && String(c.date).slice(0, 7) === key)

      out.push({ label: d.toLocaleDateString('en-GB', { month: 'short' }), value });
    }
    return out;
  }
  return (state.monthlyCollections || []).map(m => ({

    value: Number(m.collected) || 0
  }));

function parseHash() {
  let raw = (location.hash || '#/').replace(/^#\/?/, '');
  // Supabase's auth redirect appends its own tokens as a URL fragment
  // (#access_token=...&type=recovery...); boot() swaps that for #/reset
  // once it has consumed them, but guard here too so a route is never
  // parsed out of raw token data in between.
  if (/access_token=|type=recovery|error=/.test(raw)) raw = 'reset';
  const [pathStr, qs] = raw.split('?');
  const parts = pathStr.split('/').filter(Boolean);
  const query = {};
  new URLSearchParams(qs || '').forEach((v, k) => query[k] = v);
  return { path: parts[0] || '', parts, query };
}

function viewSearch() {
  const q = (route.query.q || '').toLowerCase().trim();
  if (!q) return page('Search', 'Type something in the search box above.', '');
  const hit = (s) => String(s).toLowerCase().includes(q);
  const members = db.users.where(u => hit(fullName(u)) || hit(u.occupation || '') || hit(u.town || ''));
  const sugs = db.suggestions.where(s => hit(s.title) || hit(s.description));
  const anns = db.announcements.where(a => (a.published || is('admin')) && (hit(a.title) || hit(a.content)));
  const mtgs = db.meetings.where(m => hit(m.title) || hit(m.location) || hit(m.description));
  const total = members.length + sugs.length + anns.length + mtgs.length;
  const block = (title, rows) => rows.length ? `<div class="card pad" style="margin-bottom:1rem"><h2 style="margin-bottom:.4rem">${title}</h2>${rows.join('')}</div>` : '';
  return page('Search', `${total} result${total === 1 ? '' : 's'} for “${route.query.q}”.`, total ? `
    ${block('Members', members.map(u => `<div class="item"><div class="body"><h4>${esc(fullName(u))}</h4><p>${esc(u.occupation || '')}${u.town ? ' · ' + esc(u.town) : ''}</p></div></div>`))}

    ${block('Meetings', mtgs.map(m => `<div class="item"><div class="body"><h4><button class="linkish" data-act="goto" data-href="#/meetings/${m.id}">${esc(m.title)}</button></h4><p>${fmtDate(m.date)} · ${esc(m.location)}</p></div></div>`))}

}

function viewAdmin() {

    const d = new Date(); d.setMonth(d.getMonth() - i);

    growth.push({ label: d.toLocaleDateString('en-GB', { month: 'short' }), value: users.filter(u => u.joinedAt <= cut).length, color: 'var(--light-green)' });
  }

      <div class="stat ochreline"><div class="k">Suggestions</div><div class="v">${db.suggestions.all().length}</div><div class="s">${db.suggestions.where(s => s.status === 'Under Review').length} under review</div></div>
    </div>

      <div class="card pad"><h2 style="margin-bottom:.8rem">Collections by month</h2>${barChart(monthlySeries(6))}</div>
      <div class="card pad"><h2 style="margin-bottom:.8rem">Membership growth</h2>${barChart(growth, { format: v => v + ' members' })}</div>
      <div class="card pad"><h2 style="margin-bottom:.8rem">Kitty position</h2>
        ${donut([{ label: 'Collected', value: g.collected, color: 'var(--green)' }, { label: 'Outstanding', value: g.outstanding, color: 'var(--light-green)' }], money(g.collected).replace('KSh ', ''), 'in the kitty')}</div>
    </div>

      : '<p class="muted small">Nothing scheduled.</p>'}

    </div>`);

/* ---------------- setup guide ---------------- */
function viewDocs() {
  return page('Setup guide', 'How ClassConnect is wired to Supabase, and how to operate it day to day.', `
  <div class="card pad docs prose" style="max-width:none">
    <p>ClassConnect is the management platform for the St. Veronica Bumadeya Primary School Association. This build stores everything in Supabase — Postgres for the data, Supabase Auth for sign-in — so every member sees the same association from any device or browser. There is no local database and nothing is stored only on one person's computer.</p>

    <h2>1. What's already connected</h2>
    <p>This copy of the app is pre-configured with the association's Supabase project:</p>
    <pre class="code">Project URL:      ${esc(SUPABASE_URL)}
Publishable key:  ${esc(SUPABASE_ANON_KEY)}</pre>
    <p>The publishable (anon) key is safe to ship inside the HTML — it can only do what the database's row-level security policies allow, which is why the schema step below matters as much as the app file itself.</p>

    <h2>2. One-time database setup</h2>
    <p>Before the app can be used, run <code>supabase-schema.sql</code> once, in full, in the Supabase dashboard's SQL Editor for this project. It creates every table this app reads and writes (profiles, contribution_types, contributions, suggestions, suggestion_votes, announcements, meetings, meeting_minutes, notifications, activity_logs, settings), the row-level security policy on each one, and a trigger on new sign-ups. It is safe to run more than once.</p>
    <p>Two settings are worth checking under Authentication in the dashboard:</p>
    <ul>
      <li><b>Providers → Email</b> should be turned on.</li>
      <li><b>Settings → Confirm email.</b> Leave it on for a real rollout — new members get a confirmation link before their first sign-in works, and the registration page already tells them to expect that. Turn it off only for quick internal testing, so new accounts are signed in immediately.</li>
      <li><b>URL Configuration → Site URL / Redirect URLs</b> should include wherever this HTML file ends up being hosted, so "forgot password" links open correctly.</li>
    </ul>

    <h2>3. How the first administrator is chosen</h2>
    <p>There is no seeded login and no separate admin-creation step. A trigger in <code>supabase-schema.sql</code> checks the <code>profiles</code> table at the moment each new account is created: if it is empty, that account becomes <code>admin</code>; every account after that starts as <code>member</code>. This runs inside the database itself, not in the browser, so it can't be spoofed by editing the page.</p>

    <h2>4. Running it</h2>
    <p>This is one self-contained HTML file — open it directly, or host it anywhere that serves static files (Netlify, Vercel, GitHub Pages, S3, or a folder behind Nginx). There is no build step and nothing else to deploy; the file talks straight to Supabase over HTTPS.</p>

    <h2>5. Test each role</h2>
    <ol>
      <li><b>Administrator</b> — register the very first account on the project. You'll have every permission: members, contributions, announcements, meetings, contribution types and settings.</li>
      <li><b>Treasurer</b> — register a second account, then from Manage members open it and set its role to Treasurer. A treasurer can record payments, edit records, filter and download the report, but cannot manage members, announcements or meetings.</li>
      <li><b>Member</b> — a third account, left on the default role. The sidebar has no administration group; Contributions shows only their own records; the association's overall totals still appear on their dashboard (via a database function that reports the summary without exposing anyone else's individual payments).</li>
      <li>Try an admin URL such as <code>#/admin/members</code> while signed in as a member — the route guard sends it back to the dashboard, and the database would refuse the underlying request even if it didn't.</li>
    </ol>

    <h2>6. What's different from a bare prototype</h2>
    <ul>
      <li><b>Adding members.</b> An administrator can edit, promote, deactivate or remove an existing member, but cannot create a login for someone else — only Supabase Auth can create an account, and only the person themselves can prove they own that email address. Manage members has a "Copy registration link" button for exactly this: share it, they register, then you set their role.</li>
      <li><b>Passwords.</b> Supabase Auth stores and hashes every password; this app never sees or stores one. Changing your password re-confirms your current one first; "forgot password" sends a real, single-use email link.</li>
      <li><b>Row-level security.</b> A member's own contribution rows are the only ones their account can read — the database enforces this, not just the interface. The association-wide totals a member sees on their dashboard come from a database function that returns aggregate numbers only, never another member's individual record.</li>
      <li><b>Notifications.</b> Posting an announcement or a meeting notifies every member by inserting a row addressed to each of them; a member can only ever read their own notifications back.</li>
    </ul>

    <h2>What slots in next</h2>
    <p>M-Pesa STK push (register a driver on the <code>PaymentGateway</code> seam), a Supabase Edge Function for sending SMS/WhatsApp alongside the in-app notifications, PDF statements, file storage for minutes and attachments via Supabase Storage, and Supabase Realtime so open tabs update the moment someone else records a payment.</p>
  </div>`);
}

function suggestionForm(existing) {
  openModal({
    title: existing ? 'Edit suggestion' : 'Submit a suggestion',
    body: fieldHTML('title', 'Title', { value: existing ? existing.title : '', placeholder: 'What do you propose?' })
      + fieldHTML('description', 'Describe it', { type: 'textarea', rows: 5, value: existing ? existing.description : '', placeholder: 'What should happen, and why it helps the class.' }),
    submitLabel: existing ? 'Save changes' : 'Submit suggestion',
    onSubmit: async (form, data) => {
      if (!validate(form, { title: ['required'], description: ['required'] })) return;
      if (existing) {
        await db.suggestions.update(existing.id, { title: data.title, description: data.description });
        toast('Suggestion updated.');
      } else {
        const s = await db.suggestions.insert({ title: data.title, description: data.description, authorId: session.user.id, status: 'Submitted', date: todayISO() });
        notifyAll(`${fullName(session.user)} suggested "${data.title}".`, '#/suggestions/' + s.id, session.user.id);
        logActivity('Submitted suggestion "' + data.title + '"');
        toast('Suggestion submitted.');
      }
      closeModal(); render();
    }
  });
}
function contributionForm(existing, presetUser) {
  const types = db.contributionTypes.all();
  const members = db.users.where(u => u.status === 'active');
  if (!members.length || !types.length) { toast('Add an active member and a contribution type first.', true); return; }
  openModal({
    title: existing ? 'Edit contribution record' : 'Record a payment', wide: true,
    body: `<div class="field-row">
      ${fieldHTML('userId', 'Member', { type: 'select', value: existing ? existing.userId : (presetUser || members[0].id), options: members.map(u => ({ value: u.id, label: fullName(u) })) })}
      ${fieldHTML('typeId', 'Contribution type', { type: 'select', value: existing ? existing.typeId : types[0].id, options: types.map(t => ({ value: t.id, label: `${t.name} (${money(t.defaultAmount)})` })) })}
    </div>
    <div class="field-row">
      ${fieldHTML('amount', 'Amount due', { type: 'number', value: existing ? existing.amount : types[0].defaultAmount })}
      ${fieldHTML('paid', 'Amount paid now', { type: 'number', value: existing ? existing.paid : '' })}
    </div>
    <div class="field-row">
      ${fieldHTML('date', 'Date received', { type: 'date', value: existing ? existing.date : todayISO() })}
      ${fieldHTML('reference', 'Payment reference', { value: existing ? existing.reference : '', hint: 'M-Pesa code, receipt or cheque number.' })}
    </div>
    ${fieldHTML('notes', 'Notes', { type: 'textarea', rows: 2, value: existing ? existing.notes : '' })}
    <p class="faint small" style="margin:0">Status is worked out from the amounts: nothing paid is Pending, part of it is Partially Paid, all of it is Paid.</p>`,
    submitLabel: existing ? 'Save record' : 'Record payment',
    onSubmit: async (form, d) => {
      if (!validate(form, { amount: ['required', 'positive'], paid: ['money'], date: ['required'] })) return;
      const amount = Number(d.amount), paid = Number(d.paid || 0);
      if (paid > amount) { toast('The amount paid cannot be more than the amount due.', true); return; }
      const patch = {
        userId: d.userId, typeId: d.typeId, amount, paid, date: d.date,
        status: deriveStatus(amount, paid), reference: d.reference, notes: d.notes,
        recordedBy: session.user.id
      };
      if (existing) { await db.contributions.update(existing.id, patch); toast('Record updated.'); }
      else {
        const c = await db.contributions.insert(patch);
        const ty = db.contributionTypes.find(d.typeId);
        notify(d.userId, `Your ${ty ? ty.name.toLowerCase() : 'contribution'} of ${money(paid)} has been recorded.`, '#/contributions/' + c.id);
        toast('Payment recorded.');
      }
      logActivity(`${existing ? 'Updated' : 'Recorded'} a contribution for ${fullName(db.users.find(d.userId))}`);
      closeModal(); render();
    }
  });
}

function memberForm(existing) {
  if (!existing) return; // guarded by the caller too; see the 'new-member' action
  openModal({
    title: 'Edit member', wide: true,
    body: `<div class="field-row">${fieldHTML('firstName', 'First name', { value: existing.firstName })}
      ${fieldHTML('lastName', 'Last name', { value: existing.lastName })}</div>
      <div class="field-row">${fieldHTML('email', 'Email address', { type: 'email', value: existing.email })}
      ${fieldHTML('phone', 'Phone number', { value: existing.phone })}</div>
      <div class="field-row">
      ${fieldHTML('role', 'Role', { type: 'select', value: existing.role, options: Object.entries(ROLES).map(([v, r]) => ({ value: v, label: r.label })) })}
      ${fieldHTML('status', 'Status', { type: 'select', value: existing.status, options: [{ value: 'active', label: 'Active' }, { value: 'inactive', label: 'Inactive' }] })}</div>
      <div class="field-row">${fieldHTML('occupation', 'What they do', { value: existing.occupation || '' })}
      ${fieldHTML('town', 'Town', { value: existing.town || '' })}</div>
      <p class="faint small" style="margin:0">Email here updates their ClassConnect profile only. To change the address they sign in with, they should do that themselves from a future account-settings option, or you can ask Supabase support to update auth.users directly.</p>`,
    submitLabel: 'Save member',
    onSubmit: async (form, d) => {
      if (!validate(form, { firstName: ['required'], lastName: ['required'], email: ['required', 'email'], phone: ['required', 'phone'] })) return;
      const clash = db.users.where(u => u.email.toLowerCase() === d.email.toLowerCase() && u.id !== existing.id);
      if (clash.length) { toast('That email address belongs to another member.', true); return; }
      const roleChanged = existing.role !== d.role;
      await db.users.update(existing.id, { firstName: d.firstName, lastName: d.lastName, email: d.email.toLowerCase(), phone: d.phone, role: d.role, status: d.status, occupation: d.occupation, town: d.town });
      if (roleChanged) notify(existing.id, `Your role is now ${ROLES[d.role].label}.`, '#/dashboard');
      logActivity(`Updated member ${d.firstName} ${d.lastName}`);
      toast('Member updated.');
      closeModal(); render();
    }
  });
}
function copyRegistrationLink() {
  const link = location.origin + location.pathname + '#/register';
  const done = () => toast('Registration link copied — share it with the new member.');
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(link).then(done).catch(() => openModal({
      title: 'Registration link', body: `<p class="muted small">Copy this link and share it:</p><pre class="code">${esc(link)}</pre>`,
      submitLabel: 'Done', onSubmit: () => closeModal()
    }));
  } else {
    openModal({
      title: 'Registration link', body: `<p class="muted small">Copy this link and share it:</p><pre class="code">${esc(link)}</pre>`,
      submitLabel: 'Done', onSubmit: () => closeModal()
    });
  }
}
function typeForm(existing) {
  openModal({
    title: existing ? 'Edit contribution type' : 'Add contribution type',
    body: fieldHTML('name', 'Name', { value: existing ? existing.name : '', placeholder: 'e.g. Monthly welfare' })
      + fieldHTML('defaultAmount', 'Standard amount', { type: 'number', value: existing ? existing.defaultAmount : '' })
      + fieldHTML('description', 'What it is for', { type: 'textarea', rows: 3, value: existing ? existing.description : '' }),
    submitLabel: 'Save type',
    onSubmit: async (form, d) => {
      if (!validate(form, { name: ['required'], defaultAmount: ['required', 'positive'] })) return;
      const patch = { name: d.name, defaultAmount: Number(d.defaultAmount), description: d.description, active: true };
      if (existing) await db.contributionTypes.update(existing.id, patch); else await db.contributionTypes.insert(patch);
      logActivity(`${existing ? 'Updated' : 'Created'} contribution type "${d.name}"`);
      toast('Contribution type saved.'); closeModal(); render();
    }
  });
}
function minutesForm(meetingId) {
  const m = db.meetings.find(meetingId);
  const mins = db.meetingMinutes.where(x => x.meetingId === meetingId)[0];
  openModal({
    title: (mins ? 'Edit' : 'Add') + ' minutes', wide: true,
    body: `<p class="muted small">${esc(m.title)} · ${fmtDate(m.date)}</p>`
      + fieldHTML('content', 'Minutes', { type: 'textarea', rows: 10, value: mins ? mins.content : '', placeholder: 'What was discussed, what was decided, and who is doing what.' }),
    submitLabel: 'Save minutes',
    onSubmit: async (form, d) => {
      if (!validate(form, { content: ['required'] })) return;
      if (mins) await db.meetingMinutes.update(mins.id, { content: d.content });
      else {
        await db.meetingMinutes.insert({ meetingId, content: d.content, authorId: session.user.id });
        notifyAll(`Minutes for "${m.title}" are now available.`, '#/meetings/' + meetingId, session.user.id);
      }
      logActivity(`Filed minutes for "${m.title}"`);
      toast('Minutes saved.'); closeModal(); render();
    }
  });
}
function passwordForm() {
  openModal({
    title: 'Change password',
    body: fieldHTML('current', 'Current password', { type: 'password' })
      + fieldHTML('next', 'New password', { type: 'password', hint: 'At least 8 characters.' })
      + fieldHTML('confirm', 'Repeat new password', { type: 'password' }),
    submitLabel: 'Change password',
    onSubmit: async (form, d) => {
      if (!validate(form, { current: ['required'], next: ['required', 'password'], confirm: ['required'] })) return;
      if (d.next !== d.confirm) { toast('The two new passwords do not match.', true); return; }
      // Re-authenticate with the current password first — Supabase will not
      // let a client change a password without recently proving identity.
      const { error: authError } = await sb.auth.signInWithPassword({ email: session.user.email, password: d.current });
      if (authError) { toast('Your current password is not correct.', true); return; }
      const res = await completePasswordReset(d.next);
      if (res.error) { toast(res.error, true); return; }
      logActivity('Changed their password');
      toast('Password changed.'); closeModal();
    }
  });
}
function statusForm(s) {
  openModal({
    title: 'Change suggestion status',
    body: `<p class="muted small">${esc(s.title)}</p>` + fieldHTML('status', 'Status', { type: 'select', value: s.status, options: SUGGESTION_STATUSES }),
    submitLabel: 'Save status',
    onSubmit: async (form, d) => {
      await db.suggestions.update(s.id, { status: d.status });
      notify(s.authorId, `Your suggestion "${s.title}" is now ${d.status}.`, '#/suggestions/' + s.id);
      logActivity(`Marked suggestion "${s.title}" as ${d.status}`);
      toast('Status updated.'); closeModal(); render();
    }
  });
}
function exportReport() {
  const rows = [['Member', 'Type', 'Date', 'Due', 'Paid', 'Balance', 'Status', 'Reference', 'Recorded by', 'Notes']];
  db.contributions.all().sort((a, b) => a.date.localeCompare(b.date)).forEach(c => {
    const u = db.users.find(c.userId), t = db.contributionTypes.find(c.typeId), r = db.users.find(c.recordedBy);
    rows.push([fullName(u), t ? t.name : '', c.date, c.amount, c.paid, outstandingOf(c), c.status, c.reference, r ? fullName(r) : '', (c.notes || '').replace(/\n/g, ' ')]);
  });
  const g = groupTotals();
  rows.push([], ['Totals', '', '', g.expected, g.collected, g.outstanding]);
  const csv = rows.map(r => r.map(v => `"${String(v == null ? '' : v).replace(/"/g, '""')}"`).join(',')).join('\n');
  try {
    const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
    const a = document.createElement('a');
    a.href = url; a.download = `contributions-${todayISO()}.csv`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    toast('Report downloaded.');
  } catch (e) {
    openModal({ title: 'Contribution report', wide: true, body: `<pre class="code" style="max-height:50vh">${esc(csv)}</pre>`, submitLabel: 'Done', onSubmit: () => closeModal() });
  }
  logActivity('Generated a contribution report');
}

/* ---------------- delegated events ---------------- */
const ACTIONS = {
  'open-nav': () => document.body.classList.add('nav-open'),
  'close-nav': () => document.body.classList.remove('nav-open'),
  'goto': (el) => go(el.dataset.href),
  'logout': async () => { await logout(); go('#/login'); render(); toast('Signed out.'); },
  'user-menu': () => $('#user-menu').classList.toggle('open'),
  'new-suggestion': () => suggestionForm(),
  'edit-suggestion': (el) => suggestionForm(db.suggestions.find(el.dataset.id)),
  'set-suggestion-status': (el) => { if (is('admin')) statusForm(db.suggestions.find(el.dataset.id)); },
  'delete-suggestion': (el) => confirmAction('Delete this suggestion and all its votes?', async () => {
    const id = el.dataset.id;
    await Promise.all(db.suggestionVotes.where(v => v.suggestionId === id).map(v => db.suggestionVotes.remove(v.id)));
    await db.suggestions.remove(id); toast('Suggestion deleted.'); render();
  }),
  'vote': async (el) => {
    const sid = el.dataset.id, value = Number(el.dataset.value);
    const existing = db.suggestionVotes.where(v => v.suggestionId === sid && v.userId === session.user.id)[0];
    const s = db.suggestions.find(sid);
    if (existing && existing.value === value) { await db.suggestionVotes.remove(existing.id); toast('Vote withdrawn.'); }
    else if (existing) { await db.suggestionVotes.update(existing.id, { value }); toast('Vote changed.'); }
    else {
      await db.suggestionVotes.insert({ suggestionId: sid, userId: session.user.id, value });
      if (s.authorId !== session.user.id) notify(s.authorId, `Your suggestion "${s.title}" received a new vote.`, '#/suggestions/' + sid);
      toast(value === 1 ? 'Backed.' : 'Recorded.');
    }
    render();
  },
  'record-payment': () => { if (canManageMoney()) contributionForm(); },
  'record-for': (el) => { if (canManageMoney()) contributionForm(null, el.dataset.id); },
  'edit-contribution': (el) => { if (canManageMoney()) contributionForm(db.contributions.find(el.dataset.id)); },
  'mark-paid': async (el) => {
    const c = db.contributions.find(el.dataset.id);
    await db.contributions.update(c.id, { paid: c.amount, status: 'Paid', recordedBy: session.user.id });
    notify(c.userId, 'Your contribution has been marked as fully paid.', '#/contributions/' + c.id);
    logActivity('Marked a contribution as fully paid');
    toast('Marked as paid.'); render();
  },
  'delete-contribution': (el) => confirmAction('Delete this contribution record? The member will no longer see it.', async () => {
    await db.contributions.remove(el.dataset.id); logActivity('Deleted a contribution record');
    toast('Record deleted.'); go('#/contributions'); render();
  }),
  'export-report': () => { if (canManageMoney()) exportReport(); },
  'new-type': () => typeForm(),
  'edit-type': (el) => typeForm(db.contributionTypes.find(el.dataset.id)),
  'delete-type': (el) => {
    const id = el.dataset.id;
    if (db.contributions.where(c => c.typeId === id).length) { toast('This type still has contributions recorded against it.', true); return; }
    confirmAction('Delete this contribution type?', async () => { await db.contributionTypes.remove(id); toast('Type deleted.'); render(); });
  },
  'new-announcement': () => { if (is('admin')) announcementForm(); },
  'edit-announcement': (el) => { if (is('admin')) announcementForm(db.announcements.find(el.dataset.id)); },
  'toggle-publish': async (el) => {
    const a = db.announcements.find(el.dataset.id);
    const wasPublished = a.published;
    await db.announcements.update(a.id, { published: !wasPublished, date: wasPublished ? a.date : todayISO() });
    if (!wasPublished) notifyAll('New announcement: ' + a.title, '#/announcements/' + a.id, session.user.id);
    logActivity((wasPublished ? 'Unpublished' : 'Published') + ' announcement "' + a.title + '"');
    toast(wasPublished ? 'Unpublished.' : 'Published.'); render();
  },
  'delete-announcement': (el) => confirmAction('Delete this announcement?', async () => {
    await db.announcements.remove(el.dataset.id); toast('Announcement deleted.'); go('#/announcements'); render();
  }),
  'new-meeting': () => { if (is('admin', 'treasurer')) meetingForm(); },
  'edit-meeting': (el) => { if (is('admin', 'treasurer')) meetingForm(db.meetings.find(el.dataset.id)); },
  'delete-meeting': (el) => confirmAction('Delete this meeting and its minutes?', async () => {
    const id = el.dataset.id;
    await Promise.all(db.meetingMinutes.where(x => x.meetingId === id).map(x => db.meetingMinutes.remove(x.id)));
    await db.meetings.remove(id); toast('Meeting deleted.'); go('#/meetings'); render();
  }),
  'edit-minutes': (el) => { if (is('admin', 'treasurer')) minutesForm(el.dataset.id); },
  'new-member': () => { if (is('admin')) copyRegistrationLink(); },
  'edit-member': (el) => { if (is('admin')) memberForm(db.users.find(el.dataset.id)); },
  'toggle-member': async (el) => {
    const u = db.users.find(el.dataset.id);
    if (u.id === session.user.id) { toast('You cannot deactivate your own account.', true); return; }
    const wasActive = u.status === 'active';
    await db.users.update(u.id, { status: wasActive ? 'inactive' : 'active' });
    logActivity(`${wasActive ? 'Deactivated' : 'Reactivated'} ${fullName(u)}`);
    toast('Member updated.'); render();
  },
  'delete-member': (el) => confirmAction("Remove this member's profile and every record attached to it? This cannot be undone. Their sign-in account itself must be removed separately from the Supabase dashboard.", async () => {
    const id = el.dataset.id;
    for (const t of ['contributions', 'suggestions', 'notifications']) {
      await Promise.all(db[t].where(r => r.userId === id || r.authorId === id).map(r => db[t].remove(r.id)));
    }
    await Promise.all(db.suggestionVotes.where(v => v.userId === id).map(v => db.suggestionVotes.remove(v.id)));
    await db.users.remove(id); logActivity('Removed a member profile');
    toast('Member profile removed.'); render();
  }),
  'change-password': () => passwordForm(),
  'read-one': async (el) => { await db.notifications.update(el.dataset.id, { read: true }); render(); },
  'read-all': async () => {
    await Promise.all(db.notifications.where(n => n.userId === session.user.id && !n.read).map(n => db.notifications.update(n.id, { read: true })));
    toast('All notifications marked as read.'); render();
  }
};
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el) { const m = $('#user-menu'); if (m) m.classList.remove('open'); return; }
  const act = el.dataset.act;
  if (el.tagName === 'FORM') return;
  if (ACTIONS[act]) { e.preventDefault(); ACTIONS[act](el); }
});

/* form submissions (delegated) */
document.addEventListener('submit', async (e) => {
  const form = e.target;
  e.preventDefault();

  if (form.id === 'login-form') {
    if (!validate(form, { email: ['required', 'email'], password: ['required'] })) return;
    const btn = form.querySelector('button[type=submit]'); btn.disabled = true; btn.textContent = 'Signing in…';
    const res = await login(form.elements.email.value, form.elements.password.value);
    btn.disabled = false; btn.textContent = 'Sign in';
    if (res.error) { toast(res.error, true); return; }
    await loadAllData();
    go('#/dashboard'); render(); toast(`Welcome back, ${res.user.firstName || res.user.email}.`);
    return;
  }
  if (form.id === 'register-form') {
    const d = Object.fromEntries(new FormData(form));
    if (!validate(form, { firstName: ['required'], lastName: ['required'], email: ['required', 'email'], phone: ['required', 'phone'], password: ['required', 'password'], confirm: ['required'] })) return;
    if (d.password !== d.confirm) { toast('The two passwords do not match.', true); return; }
    if (!d.terms) { toast('Please accept the visibility note to continue.', true); return; }
    const btn = form.querySelector('button[type=submit]'); btn.disabled = true; btn.textContent = 'Creating account…';
    const res = await register(d);
    btn.disabled = false; btn.textContent = 'Create account';
    if (res.error) { toast(res.error, true); return; }
    if (res.needsConfirmation) {
      go('#/login'); render();
      toast('Check your email to confirm your account, then sign in.');
      return;
    }
    await loadAllData();
    go('#/dashboard'); render();
    toast(res.isFirstAccount ? 'Account created — you are the administrator.' : 'Account created. Welcome to the association.');
    return;
  }
  if (form.id === 'forgot-form') {
    if (!validate(form, { email: ['required', 'email'] })) return;
    const btn = form.querySelector('button[type=submit]'); btn.disabled = true;
    const res = await requestPasswordReset(form.elements.email.value);
    btn.disabled = false;
    if (res.error) { toast(res.error, true); return; }
    go('#/login'); render();
    toast('If that email is registered, a reset link is on its way.');
    return;
  }
  if (form.id === 'reset-form') {
    const d = Object.fromEntries(new FormData(form));
    if (!validate(form, { password: ['required', 'password'], confirm: ['required'] })) return;
    if (d.password !== d.confirm) { toast('The two passwords do not match.', true); return; }
    const res = await completePasswordReset(d.password);
    if (res.error) { toast(res.error, true); return; }
    recoveryActive = false;
    go('#/dashboard'); render();
    toast('Password set. You are signed in.');
    return;
  }
  if (form.id === 'profile-form') {
    if (!validate(form, { firstName: ['required'], lastName: ['required'], email: ['required', 'email'], phone: ['required', 'phone'] })) return;
    const d = Object.fromEntries(new FormData(form));
    const clash = db.users.where(u => u.email.toLowerCase() === d.email.toLowerCase() && u.id !== session.user.id);
    if (clash.length) { toast('That email address belongs to another member.', true); return; }
    const updated = await db.users.update(session.user.id, { firstName: d.firstName, lastName: d.lastName, email: d.email.toLowerCase(), phone: d.phone, occupation: d.occupation, town: d.town, bio: d.bio });
    session.user = updated;
    logActivity('Updated their profile');
    render(); toast('Profile saved.');
    return;
  }
  if (form.id === 'settings-form') {
    if (!validate(form, { orgName: ['required'], currency: ['required'], monthlyWelfare: ['required', 'money'] })) return;
    const d = Object.fromEntries(new FormData(form));
    const { error } = await sb.from('settings').update({
      org_name: d.orgName, tagline: d.tagline, currency: d.currency,
      monthly_welfare: Number(d.monthlyWelfare), allow_registration: !!d.allowRegistration
    }).eq('id', 1);
    if (error) { toast('Could not save: ' + error.message, true); return; }
    Object.assign(state.settings, { orgName: d.orgName, tagline: d.tagline, currency: d.currency, monthlyWelfare: Number(d.monthlyWelfare), allowRegistration: !!d.allowRegistration });
    logActivity('Updated association settings');
    render(); toast('Settings saved.');
    return;
  }
  if (form.id === 'mpesa-form') {
    const d = Object.fromEntries(new FormData(form));
    const { error } = await sb.from('settings').update({ mpesa_paybill: d.mpesaPaybill, mpesa_account_prefix: d.mpesaAccountPrefix }).eq('id', 1);
    if (error) { toast('Could not save: ' + error.message, true); return; }
    Object.assign(state.settings, { mpesaPaybill: d.mpesaPaybill, mpesaAccountPrefix: d.mpesaAccountPrefix });
    toast('Payment details saved for the future integration.');
    return;
  }
  if (form.dataset.act === 'search-form' || form.dataset.act === 'member-search') {
    const q = form.elements.q.value.trim();
    go(form.dataset.act === 'member-search'
      ? (q ? '#/members?q=' + encodeURIComponent(q) : '#/members')
      : (q ? '#/search?q=' + encodeURIComponent(q) : '#/search'));
    return;
  }
  if (form.dataset.act === 'contrib-filter') {
    const d = Object.fromEntries(new FormData(form));
    const qs = Object.entries(d).filter(([, v]) => v).map(([k, v]) => k + '=' + encodeURIComponent(v)).join('&');
    go('#/contributions' + (qs ? '?' + qs : ''));
    return;
  }
});

/* ---------------- theme ---------------- */


/* ---------------- render ---------------- */
function render() {
  route = parseHash();
  document.body.classList.remove('nav-open');
  const root = $('#root');
  const p = route.parts;
  const head = p[0] || '';

  if (head === 'reset') {
    root.innerHTML = viewResetPassword();
    window.scrollTo(0, 0);
    return;
  }

  if (!session.user) {
    if (!PUBLIC_ROUTES.includes(head)) { location.replace('#/login'); route = parseHash(); }
    const v = { '': viewLanding, 'login': viewLogin, 'register': viewRegister, 'forgot': viewForgot }[route.parts[0] || ''] || viewLogin;
    root.innerHTML = v();
    window.scrollTo(0, 0);
    return;
  }
  if (PUBLIC_ROUTES.includes(head) && head !== '') { location.replace('#/dashboard'); route = parseHash(); }

  let body;
  const seg = route.parts;
  switch (seg[0] || 'dashboard') {
    case '': case 'dashboard': body = viewDashboard(); break;
    case 'profile': body = viewProfile(); break;
    case 'members': body = viewMembers(); break;
    case 'contributions': body = seg[1] ? viewContributionDetail(seg[1]) : viewContributions(); break;
    case 'suggestions': body = seg[1] ? viewSuggestionDetail(seg[1]) : viewSuggestions(); break;
    case 'announcements': body = seg[1] ? viewAnnouncementDetail(seg[1]) : viewAnnouncements(); break;
    case 'meetings': body = seg[1] ? viewMeetingDetail(seg[1]) : viewMeetings(); break;
    case 'notifications': body = viewNotifications(); break;
    case 'search': body = viewSearch(); break;
    case 'settings': body = viewSettings(); break;
    case 'docs': body = viewDocs(); break;
    case 'admin': {
      const sub = seg[1];
      const treasurerOK = sub === 'contributions' && is('treasurer');
      if (!is('admin') && !treasurerOK) {
        body = page('Not permitted', 'That area is limited to other roles.',
          empty('You do not have access to this page', 'Your role is ' + ROLES[session.user.role].label + '. Ask an administrator if you think that is wrong.',
            '<a class="btn" href="#/dashboard" style="margin-top:.8rem">Back to dashboard</a>'));
        break;
      }
      body = !sub ? viewAdmin()
        : sub === 'members' ? viewManageMembers()
          : sub === 'contributions' ? viewManageContributions()
            : sub === 'suggestions' ? viewManageSuggestions()
              : sub === 'announcements' ? viewManageAnnouncements()
                : sub === 'meetings' ? viewManageMeetings()
                  : viewAdmin();
      break;
    }
    default:
      body = page('Page not found', 'That address does not match anything in ClassConnect.',
        empty('Nothing here', 'Check the link, or head back to your dashboard.', '<a class="btn" href="#/dashboard" style="margin-top:.8rem">Back to dashboard</a>'));
  }
  root.innerHTML = shell(body);
  window.scrollTo(0, 0);
}

/* ---------------- boot ---------------- */
let recoveryActive = false;
(async function boot() {
  window.addEventListener('hashchange', render);
  if (/type=recovery/.test(location.hash)) recoveryActive = true;

  sb.auth.onAuthStateChange((event) => {
    if (event === 'PASSWORD_RECOVERY') { recoveryActive = true; render(); }
    if (event === 'SIGNED_OUT') { session.user = null; resetCache(); render(); }
  });

  const { data: { session: sbSession } } = await sb.auth.getSession();
  if (sbSession && sbSession.user) {
    const profile = await fetchProfile(sbSession.user.id);
    if (profile && profile.status === 'active') { session.user = profile; await loadAllData(); }
    else if (profile) { await sb.auth.signOut(); }
  }
  if (recoveryActive) history.replaceState(null, '', location.pathname + '#/reset');
  else if (!location.hash) location.replace(session.user ? '#/dashboard' : '#/');
  render();
})();
